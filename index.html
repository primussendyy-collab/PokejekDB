<!DOCTYPE html>
<html>
<head>
  <title>Pokemon TCG Inventory</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .card { border: 1px solid #ddd; padding: 10px; margin: 10px; }
    img { width: 100px; }
  </style>
</head>
<body>

<h1>My Pokemon Cards</h1>
<div id="cards"></div>

<script>
const url = "https://opensheet.elk.sh/1pu3VU18JM7jmHzTAqONR7Yr8RlT6VdWQNyQMOPOcr0A/Sheet1";

fetch(url)
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("cards");

    data.forEach(card => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h3>${card.Name}</h3>
        <img src="${card.Image}" />
        <p>Set: ${card.Set}</p>
        <p>Price: Rp ${card.Price}</p>
        <p>Stock: ${card.Stock}</p>
      `;

      container.appendChild(div);
    });
  });
</script>

</body>
</html>
