/* 🔥 Grid layout */
#cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
}

/* 🧱 Card style */
.card {
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);

}

/* 🖼️ Image styling */
.card img {
  width: 100%;
  border-radius: 8px;
}

/* 📝 Text styling */
.card h3 {
  font-size: 16px;
  margin: 8px 0;
}

.card p {
  font-size: 14px;
  margin: 2px 0;
}

}
</style>
</head>

function displayCards(cards) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  cards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
  <img src="${card.Image}" />
  <h3>${card.Name}</h3>
  <p>${card.Set}</p>
  <p><strong>Rp ${card.Price}</strong></p>
  <p>${card.Stock > 0 ? "🟢 In Stock" : "🔴 Sold Out"}</p>
`;

    container.appendChild(div);
  });
}

// 🔍 Search function
document.getElementById("search").addEventListener("input", function(e) {
  const keyword = e.target.value.toLowerCase();

  const filtered = allCards.filter(card =>
    card.Name.toLowerCase().includes(keyword)
  );

  displayCards(filtered);
});
</script>
