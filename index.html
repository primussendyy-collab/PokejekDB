<!DOCTYPE html>
<html>
<head>
  <title>Pokemon TCG Inventory</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

/* 🔷 HEADER */
#header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px;
  background: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 1000;
  height: 60px;
}

#header h1 {
  font-size: 20px;
  margin: 0;
}

/* 🍔 Menu button */
#menuBtn {
  font-size: 20px;
  background: #eee;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
}

/* 📂 Sidebar */
#sidebar {
  position: fixed;
  top: 60px;
  left: 0;
  transform: translateX(-250px);
  width: 250px;
  height: 100%;
  background: white;
  box-shadow: 2px 0 8px rgba(0,0,0,0.2);
  padding: 20px;
  transition: transform 0.3s ease;
  z-index: 900;
}

.sidebar-open #sidebar {
  transform: translateX(0);
}

/* ✅ FIXED BUTTON STYLE */
#sidebar h3 {
  margin-bottom: 15px;
}

#sidebar button {
  display: block;        /* 🔥 THIS FIXES YOUR ISSUE */
  width: 100%;
  margin: 8px 0;
  padding: 10px;
  border: none;
  background: #f0f0f0;
  border-radius: 8px;
  text-align: left;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s;
}

#sidebar button:hover {
  background: #ddd;
}

/* 📦 Main Content */
#mainContent {
  transition: transform 0.3s ease;
}

.sidebar-open #mainContent {
  transform: translateX(250px);
}

/* 🔍 Search */
#search {
  width: calc(100% - 40px);
  margin: 20px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
}

/* 🔥 Grid */
#cards {
  padding: 0 20px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
}

/* 🧱 Card */
.card {
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

.card h3 {
  font-size: 16px;
  margin: 8px 0;
}

.card p {
  font-size: 14px;
  margin: 2px 0;
}
</style>
</head>

<body>

<!-- 📂 Sidebar -->
<div id="sidebar">
  <h3>Filter by Set</h3>
  <div id="setFilters"></div>
</div>

<!-- 📦 MAIN CONTENT -->
<div id="mainContent">

  <!-- 🔷 Header -->
  <div id="header">
    <button id="menuBtn">☰</button>
    <h1>PokeJek Database</h1>
  </div>

  <!-- 🔍 Search -->
  <input 
    type="text" 
    id="search" 
    placeholder="Search Pokemon..." 
  />

  <!-- 🧾 Cards -->
  <div id="cards"></div>

</div>

<script>

// ✅ MENU TOGGLE
const menuBtn = document.getElementById("menuBtn");
let isOpen = false;

menuBtn.onclick = () => {
  isOpen = !isOpen;
  document.body.classList.toggle("sidebar-open", isOpen);
};

// 🌐 DATA
const url = "https://opensheet.elk.sh/1pu3VU18JM7jmHzTAqONR7Yr8RlT6VdWQNyQMOPOcr0A/Sheet1";

let allCards = [];

// ✅ FETCH
fetch(url)
  .then(res => res.json())
  .then(data => {
    allCards = data;
    displayCards(allCards);

    const sets = [...new Set(data.map(card => card.Set))];
    const filterContainer = document.getElementById("setFilters");

    // 🔘 ALL
    const allBtn = document.createElement("button");
    allBtn.innerText = "All";
    allBtn.onclick = () => displayCards(allCards);
    filterContainer.appendChild(allBtn);

    // 🔘 SETS
    sets.forEach(set => {
      const btn = document.createElement("button");
      btn.innerText = set;

      btn.onclick = () => {
        const filtered = allCards.filter(card => card.Set === set);
        displayCards(filtered);
      };

      filterContainer.appendChild(btn);
    });
  });

// ✅ DISPLAY
function displayCards(cards) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  cards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${card.Image}" />
      <h3>${card.Name}</h3>
      <p>${card.Set}</p>
      <p><strong>Rp ${Number(card.Price).toLocaleString("id-ID")}</strong></p>
      <p>${card.Stock > 0 ? "🟢 In Stock" : "🔴 Sold Out"}</p>
    `;

    container.appendChild(div);
  });
}

// 🔍 SEARCH
document.getElementById("search").addEventListener("input", function(e) {
  const keyword = e.target.value.toLowerCase();

  const filtered = allCards.filter(card =>
    card.Name.toLowerCase().includes(keyword)
  );

  displayCards(filtered);
});

</script>

</body>
</html>
