<!DOCTYPE html>
<html>
<head>
  <title>Pokemon TCG Inventory</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
}

/* 🔥 Grid layout */
#cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
}

/* 🧱 Card style */
.card {
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

.card h3 {
  font-size: 16px;
  margin: 8px 0;
}

.card p {
  font-size: 14px;
  margin: 2px 0;
}

/* 🍔 Menu button */
#menuBtn {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 1100;
  background: white;
  border: none;
  border-radius: 8px;
  padding: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* 📂 Sidebar */
#sidebar {
  position: fixed;
  top: 0;
  left: -250px;
  width: 250px;
  height: 100%;
  background: white;
  box-shadow: 2px 0 8px rgba(0,0,0,0.2);
  padding: 20px;
  transition: 0.3s;
  z-index: 1000;
}

#sidebar button {
  display: block;
  width: 100%;
  margin: 5px 0;
  padding: 8px;
  border: none;
  background: #f0f0f0;
  border-radius: 6px;
}
</style>

</head>

<body>

<!-- 🍔 Correct placement -->
<button id="menuBtn">☰</button>

<div id="sidebar">
  <h3>Filter by Set</h3>
  <div id="setFilters"></div>
</div>

<h1>PokeJek Database</h1>

<input 
  type="text" 
  id="search" 
  placeholder="Search Pokemon..." 
  style="padding:10px; width:100%; margin-bottom:20px; font-size:16px;"
/>

<div id="cards"></div>

<script>
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");

menuBtn.onclick = () => {
  sidebar.style.left = (sidebar.style.left === "0px") ? "-250px" : "0px";
};

const url = "https://opensheet.elk.sh/1pu3VU18JM7jmHzTAqONR7Yr8RlT6VdWQNyQMOPOcr0A/Sheet1";

let allCards = [];

fetch(url)
  .then(res => res.json())
  .then(data => {
    allCards = data;
    displayCards(allCards);

    // ✅ Generate set filters HERE
    const sets = [...new Set(data.map(card => card.Set))];
    const filterContainer = document.getElementById("setFilters");

    // All button
    const allBtn = document.createElement("button");
    allBtn.innerText = "All";
    allBtn.onclick = () => displayCards(allCards);
    filterContainer.appendChild(allBtn);

    // Set buttons
    sets.forEach(set => {
      const btn = document.createElement("button");
      btn.innerText = set;

      btn.onclick = () => {
        const filtered = allCards.filter(card => card.Set === set);
        displayCards(filtered);
        sidebar.style.left = "-250px";
      };

      filterContainer.appendChild(btn);
    });
  });

function displayCards(cards) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  cards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${card.Image}" />
      <h3>${card.Name}</h3>
      <p>${card.Set}</p>
      <p><strong>Rp ${Number(card.Price).toLocaleString("id-ID")}</strong></p>
      <p>${card.Stock > 0 ? "🟢 In Stock" : "🔴 Sold Out"}</p>
    `;

    container.appendChild(div);
  });
}

// 🔍 Search
document.getElementById("search").addEventListener("input", function(e) {
  const keyword = e.target.value.toLowerCase();

  const filtered = allCards.filter(card =>
    card.Name.toLowerCase().includes(keyword)
  );

  displayCards(filtered);
});
</script>
