<!DOCTYPE html>
<html>
<head>
  <title>Pokemon TCG Inventory</title>

<style>

/* ===== HEADER ===== */
#header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px;
  background: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 1000;
  height: 60px;
}

#header h1 {
  font-size: 20px;
  margin: 0;
}

/* ===== BODY ===== */
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

/* ===== LAYOUT ===== */
#app {
  display: flex;
}

/* ===== SIDEBAR ===== */
#sidebar {
  width: 250px;
  background: white;
  box-shadow: 2px 0 8px rgba(0,0,0,0.2);
  padding: 20px;

  position: fixed;
  top: 60px;
  left: -250px; /* hidden initially */

  height: calc(100% - 60px);
  transition: 0.3s;
  z-index: 1000;
}

#sidebar.active {
  left: 0;
}

#sidebar button {
  display: block;
  width: 100%;
  margin: 5px 0;
  padding: 8px;
  border: none;
  background: #f0f0f0;
  border-radius: 6px;
}

/* ===== MAIN CONTENT ===== */
#mainContent {
  flex: 1;
  transition: margin-left 0.3s;
}

#mainContent.shift {
  margin-left: 250px;
}

/* ===== SEARCH ===== */
#search {
  width: calc(100% - 40px);
  margin: 20px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
}

/* ===== CARDS ===== */
#cards {
  padding: 0 20px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

.card h3 {
  font-size: 16px;
  margin: 8px 0;
}

.card p {
  font-size: 14px;
  margin: 2px 0;
}

/* ===== MENU BUTTON ===== */
#menuBtn {
  font-size: 20px;
  background: #eee;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
}

</style>
</head>

<body>

<!-- HEADER -->
<div id="header">
  <button id="menuBtn">☰</button>
  <h1>PokeJek Database</h1>
</div>

<!-- APP LAYOUT -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <h3>Filter by Set</h3>
    <div id="setFilters"></div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="mainContent">

    <input 
      type="text" 
      id="search" 
      placeholder="Search Pokemon..." 
    />

    <div id="cards"></div>

  </div>

</div>

<script>

// ===== MENU TOGGLE =====
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const mainContent = document.getElementById("mainContent");

menuBtn.onclick = () => {
  sidebar.classList.toggle("active");
  mainContent.classList.toggle("shift");
};

// ===== DATA FETCH =====
const url = "https://opensheet.elk.sh/1pu3VU18JM7jmHzTAqONR7Yr8RlT6VdWQNyQMOPOcr0A/Sheet1";

let allCards = [];

fetch(url)
  .then(res => res.json())
  .then(data => {
    allCards = data;
    displayCards(allCards);

    const sets = [...new Set(data.map(card => card.Set))];
    const filterContainer = document.getElementById("setFilters");

    // ALL BUTTON
    const allBtn = document.createElement("button");
    allBtn.innerText = "All";
    allBtn.onclick = () => displayCards(allCards);
    filterContainer.appendChild(allBtn);

    // SET BUTTONS
    sets.forEach(set => {
      const btn = document.createElement("button");
      btn.innerText = set;

      btn.onclick = () => {
        const filtered = allCards.filter(card => card.Set === set);
        displayCards(filtered);
      };

      filterContainer.appendChild(btn);
    });
  });

// ===== DISPLAY CARDS =====
function displayCards(cards) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  cards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${card.Image}" />
      <h3>${card.Name}</h3>
      <p>${card.Set}</p>
      <p><strong>Rp ${Number(card.Price).toLocaleString("id-ID")}</strong></p>
      <p>${card.Stock > 0 ? "🟢 In Stock" : "🔴 Sold Out"}</p>
    `;

    container.appendChild(div);
  });
}

// ===== SEARCH =====
document.getElementById("search").addEventListener("input", function(e) {
  const keyword = e.target.value.toLowerCase();

  const filtered = allCards.filter(card =>
    card.Name.toLowerCase().includes(keyword)
  );

  displayCards(filtered);
});

</script>

</body>
</html>
