<!DOCTYPE html>
<html>
<head>
  <title>Pokemon TCG Inventory</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .card { border: 1px solid #ddd; padding: 10px; margin: 10px; }
    img { width: 100px; }
  </style>
</head>
<body>

<h1>PokeJek Database</h1>

  <input 
  type="text" 
  id="search" 
  placeholder="Search Pokemon..." 
  style="padding:10px; width:100%; margin-bottom:20px; font-size:16px;"
/>
  
<div id="cards"></div>

<script>
const url = "https://opensheet.elk.sh/1pu3VU18JM7jmHzTAqONR7Yr8RlT6VdWQNyQMOPOcr0A/Sheet1";

let allCards = [];

fetch(url)
  .then(res => res.json())
  .then(data => {
    allCards = data;
    displayCards(allCards);
  });

function displayCards(cards) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  cards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${card.Name}</h3>
      <img src="${card.Image}" style="width:120px;" />
      <p>Set: ${card.Set}</p>
      <p>Price: Rp ${card.Price}</p>
      <p>Stock: ${card.Stock}</p>
    `;

    container.appendChild(div);
  });
}

// 🔍 Search function
document.getElementById("search").addEventListener("input", function(e) {
  const keyword = e.target.value.toLowerCase();

  const filtered = allCards.filter(card =>
    card.Name.toLowerCase().includes(keyword)
  );

  displayCards(filtered);
});
</script>
</body>
</html>
